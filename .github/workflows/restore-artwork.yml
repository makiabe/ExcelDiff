name: Verify and publish site artwork
on:
  push:
    branches: [main]
    paths:
      - '.github/artwork-manifest.json'
      - '.github/artwork-patches.json'
      - '.github/restore-artwork.py'
      - '.github/workflows/restore-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artwork-publish
  cancel-in-progress: false
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore verified artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          ref = os.environ['GITHUB_SHA']
          url = 'https://api.github.com/repos/' + repo + '/contents/.github/restore-artwork.py?ref=' + ref
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as response:
              obj = json.load(response)
          text = base64.b64decode(obj['content']).decode('utf-8')
          text = text.replace('for index, part in patches.items():\n', "for index, part in patches.items():\n        if index.startswith('_'):\n            continue\n")
          text = text.replace("base64.b64decode(spec['runs'], validate=True)", "base64.b64decode(patches.get('_runs', spec['runs']), validate=True)")
          text = text.replace("for source in spec['inputs']:", "for source in spec['inputs'] + patches.get(name, {}).get('_inputs', []):")
          script = pathlib.Path('restore-artwork.py')
          script.write_text(text)
          subprocess.run(['python3', str(script)], check=True)
          PY
