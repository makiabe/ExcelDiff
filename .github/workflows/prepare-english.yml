name: Prepare English release
on:
  push:
    branches: [feat/english-i18n]
    paths: [.github/workflows/prepare-english.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install one-time migration and browser-test dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts acorn@8.15.0
          python -m pip install beautifulsoup4==4.14.3 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Extract translation keys and compile approved translations
        run: |
          node .publication/migrate.mjs
          python .publication/prepare-html.py
          python .publication/translate.py
      - name: Restore the two supplied international mascot images
        shell: python
        run: |
          import base64, hashlib
          from pathlib import Path
          expected = {
            'hero': 'ea0b20c94d55ed5b93124ed74ea188876d8e2a66b0b1c060647f061e439fd0ac',
            'bottom': '80ae051bfd67aaa2f2d241c6d3cf2abc61737eeb7d5635eb14b4448a452c83b5'
          }
          for name, checksum in expected.items():
              encoded = ''.join(Path(f'.publication/{name}-{i}.b64').read_text() for i in range(2))
              image = base64.b64decode(encoded, validate=True)
              assert hashlib.sha256(image).hexdigest() == checksum, f'Image checksum mismatch: {name}'
              Path(f'assets/{name}-cat-intl.avif').write_bytes(image)
      - name: Build and test the localized application
        run: |
          npm run build
          npm run check
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/excel-diff-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/en/ > /dev/null && break; sleep 1; done
          python tests/browser.py
      - name: Commit generated release files to the feature branch
        run: |
          git rm -r .publication
          rm -rf .publication
          git add index.html en locales src app.js diff-engine.js file-codec.js sitemap.xml .nojekyll assets/hero-cat-intl.avif assets/bottom-cat-intl.avif
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: build and validate English locale with shared translations and text-free artwork'
          git push origin HEAD:feat/english-i18n
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-release-validation
          path: test-results/
          retention-days: 7
