name: Verify site
on:
  push:
    branches: [main, feat/english-i18n]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generated localized pages
        run: |
          if [ -f .publication/migrate.mjs ]; then
            echo 'The Prepare English release workflow will build and validate this one-time migration.'
          else
            npm run build
            npm run check
            git diff --exit-code -- index.html en locales sitemap.xml .nojekyll
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: excel-diff-site
          path: |
            .
            !.git
            !node_modules
            !.publication
          include-hidden-files: true
          retention-days: 7
